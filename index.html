<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Run Tracker</title>
  <meta name="description" content="Your running plan, one day at a time.">
  <meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0C10" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Runs">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-v2-180.png">
  <link rel="icon" href="icon-v2-180.png">
  <style>
    :root {
      --bg: #F3F4F8;
      --surface: #FFFFFF;
      --surface-2: #E9EBF2;
      --ink: #12141A;
      --muted: #5F6470;
      --line: #DDE0E8;
      --accent: #2563EB;        /* blue: actions, today, links */
      --accent-bg: #2563EB;
      --accent-ink: #FFFFFF;
      --accent-soft: #E3ECFF;
      --purple: #7C3AED;        /* purple: phases, the bigger picture */
      --purple-soft: #EEE6FF;
      --grad: linear-gradient(90deg, #2563EB, #7C3AED);
      --done: #1C7A4B;
      --done-soft: #DCEFE3;
      --skip: #6A6E78;
      --danger: #B42318;
      --tabbar: rgba(243, 244, 248, 0.86);

      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0B0C10;
        --surface: #15171D;
        --surface-2: #1E2129;
        --ink: #F1F2F6;
        --muted: #979BA6;
        --line: #272A33;
        --accent: #6EA4FF;
        --accent-bg: #2F6FEB;
        --accent-ink: #FFFFFF;
        --accent-soft: #15233F;
        --purple: #B794FF;
        --purple-soft: #261B40;
        --grad: linear-gradient(90deg, #3B82F6, #A26BFF);
        --done: #45C482;
        --done-soft: #15301F;
        --skip: #9DA1AB;
        --danger: #FF6B5E;
        --tabbar: rgba(11, 12, 16, 0.84);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.45 var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--accent); }
    svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + var(--s6)) max(var(--s4), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 96px) max(var(--s4), env(safe-area-inset-left));
    }

    /* ---- type ---- */
    .top { margin-bottom: var(--s5); }
    .eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .eyebrow.accent { color: var(--purple); }
    .title { margin: var(--s1) 0 0; font: 700 34px/1.1 var(--font-display); letter-spacing: -0.02em; }
    .sub { margin: var(--s1) 0 0; color: var(--muted); }
    .help { margin: 0; font-size: 14px; color: var(--muted); }
    .help.error { color: var(--danger); }
    code { font-size: 13px; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); overflow-wrap: anywhere; }

    /* ---- buttons ---- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      min-height: 48px; padding: 0 var(--s5);
      border: 1px solid var(--line); border-radius: var(--r-md);
      background: var(--surface); color: var(--ink);
      font-weight: 600; text-decoration: none;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn svg { font-size: 20px; }
    .btn.primary { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--accent-ink); }
    .btn.ghost { background: transparent; }
    .btn.danger { background: transparent; color: var(--danger); border-color: var(--line); }
    .btn.block { display: flex; width: 100%; }
    .btn-row { display: flex; gap: var(--s2); flex-wrap: wrap; }
    .btn-row .btn { flex: 1; }
    .link { border: 0; background: none; padding: var(--s2) 0; color: var(--accent); font-weight: 500; }
    .link.strong { font-weight: 700; }

    /* ---- cards ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: var(--s5);
      margin-bottom: var(--s6);
    }
    .card.workout { position: relative; overflow: hidden; }
    .card.workout::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--grad); }
    .workout-title { margin: var(--s2) 0 0; font: 700 26px/1.15 var(--font-display); letter-spacing: -0.015em; }
    .distance { margin: var(--s3) 0 0; display: flex; align-items: baseline; gap: var(--s2); }
    .distance .num { font: 700 64px/0.95 var(--font-display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .distance .unit { font-size: 17px; font-weight: 500; color: var(--muted); }
    .note { margin: var(--s4) 0 0; color: var(--muted); }

    .steps { list-style: none; margin: var(--s5) 0 0; padding: 0; counter-reset: step; }
    .steps li {
      counter-increment: step;
      position: relative;
      padding: var(--s3) 0 var(--s3) 40px;
      border-top: 1px solid var(--line);
      font-weight: 500;
    }
    .steps li:last-child { border-bottom: 1px solid var(--line); }
    .steps li::before {
      content: counter(step);
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
      font-size: 13px; font-weight: 700;
    }

    .actions { display: grid; grid-template-columns: 2fr 1fr; gap: var(--s2); margin-top: var(--s6); }
    .result {
      display: flex; align-items: center; gap: var(--s3);
      margin-top: var(--s6); padding: var(--s3) var(--s4);
      border-radius: var(--r-md); font-weight: 600;
    }
    .result > span:nth-child(2) { flex: 1; }
    .result.done { background: var(--done-soft); color: var(--done); }
    .result.skipped { background: var(--surface-2); color: var(--skip); }
    .result-icon { font-size: 22px; display: grid; }
    .result .link { color: inherit; text-decoration: underline; }
    .edit-link { display: block; margin: var(--s3) auto 0; font-size: 15px; color: var(--muted); }

    .next {
      display: grid; gap: 2px; width: 100%; text-align: left;
      margin-top: var(--s5); padding: var(--s4);
      border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg);
    }
    .next-title { font-weight: 600; font-size: 17px; }
    .next-dist { color: var(--muted); font-size: 15px; }
    .card.info .btn { margin-top: var(--s5); }

    /* ---- week strip ---- */
    .week-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
    .week-head h2, .plan-week h2 { margin: 0; font: 700 20px/1.2 var(--font-display); }
    .range { font-weight: 500; color: var(--muted); font-size: 15px; margin-left: var(--s1); }
    .pill {
      display: inline-block; padding: 2px var(--s2); border-radius: 999px;
      background: var(--purple-soft); color: var(--purple);
      font-size: 12px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
    }
    .goal { margin: var(--s1) 0 0; color: var(--muted); font-size: 15px; }

    .strip { list-style: none; margin: var(--s4) 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .chip {
      width: 100%; display: grid; justify-items: center; gap: 2px;
      padding: var(--s2) 0; border: 1px solid transparent; border-radius: var(--r-md);
      background: var(--surface);
    }
    .chip .dow { font-size: 11px; font-weight: 600; color: var(--muted); }
    .chip .dnum { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chip .mark { height: 16px; font-size: 16px; display: grid; }
    .chip.rest { background: transparent; }
    .chip.rest .dnum { color: var(--muted); font-weight: 500; }
    .chip.planned .mark { color: var(--accent); }
    .chip.done .mark { color: var(--done); }
    .chip.skipped .mark { color: var(--skip); }
    .chip.skipped .dnum { text-decoration: line-through; color: var(--muted); }
    .chip.is-today { border-color: var(--accent); }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .chip[aria-pressed="true"] .dow, .chip[aria-pressed="true"] .dnum, .chip[aria-pressed="true"] .mark { color: var(--bg); }

    .progress { margin-top: var(--s4); }
    .progress p { margin: var(--s2) 0 0; font-size: 14px; color: var(--muted); }
    .progress strong { color: var(--ink); }
    .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .bar span { display: block; height: 100%; width: var(--p); background: var(--grad); border-radius: inherit; transition: width 0.3s ease; }

    /* ---- coming up ---- */
    .upnext { margin-top: var(--s8); }
    .section-title { margin: 0 0 var(--s3); font: 700 20px/1.2 var(--font-display); }
    .rows .when { font-size: 13px; font-weight: 600; color: var(--purple); white-space: nowrap; }
    .row.up { grid-template-columns: 44px 1fr auto; }

    /* ---- plan list ---- */
    .plan-week { margin-bottom: var(--s6); scroll-margin-top: calc(env(safe-area-inset-top) + var(--s4)); }
    .week-btn {
      display: flex; align-items: flex-start; gap: var(--s3); width: 100%;
      padding: var(--s2) 0 var(--s3); border: 0; background: none; text-align: left;
    }
    .week-btn-main { flex: 1; display: grid; gap: var(--s1); }
    .week-btn .goal { margin: 0; }
    .count { font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
    .plan-week.is-current .week-btn h2::after {
      content: "This week"; margin-left: var(--s2); vertical-align: 3px;
      padding: 2px var(--s2); border-radius: 999px; background: var(--ink); color: var(--bg);
      font: 700 11px/1.4 var(--font); letter-spacing: 0.04em; text-transform: uppercase;
    }

    .rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
    .rows li + li { border-top: 1px solid var(--line); }
    .row {
      display: grid; grid-template-columns: 44px 1fr 24px; align-items: center; gap: var(--s3);
      width: 100%; padding: var(--s3) var(--s4); border: 0; background: none; text-align: left;
    }
    .row:active { background: var(--surface-2); }
    .date { display: grid; justify-items: center; line-height: 1.1; }
    .date .dow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .date .dnum { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .row.is-today .date { color: var(--accent); }
    .row.is-today .date .dow { color: var(--accent); }
    .row-body { display: grid; min-width: 0; }
    .row-title { font-weight: 600; }
    .row-dist { font-size: 14px; color: var(--muted); }
    .row-status { display: grid; font-size: 20px; }
    .row.done .row-status { color: var(--done); }
    .row.skipped .row-status { color: var(--skip); }
    .row.skipped .row-title { text-decoration: line-through; color: var(--muted); }
    .week-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); padding: var(--s1) var(--s1) 0; font-size: 14px; color: var(--muted); }

    /* ---- settings ---- */
    .group { margin-bottom: var(--s8); }
    .group-title { margin: 0 0 var(--s2) var(--s1); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .list { list-style: none; margin: 0 0 var(--s3); padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
    .list li + li { border-top: 1px solid var(--line); }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); width: 100%; padding: var(--s3) var(--s4); border: 0; background: none; text-align: left; }
    .list-title { display: block; font-weight: 600; }
    .list-sub { display: block; font-size: 14px; color: var(--muted); }
    .badge { padding: 2px var(--s2); border-radius: 999px; background: var(--done-soft); color: var(--done); font-size: 12px; font-weight: 700; }
    .panel { display: grid; gap: var(--s4); padding: var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
    .panel p { margin: 0; }
    .how { padding-left: var(--s5); display: grid; gap: var(--s1); }
    .hint { background: var(--accent-soft); border-color: transparent; }

    /* ---- forms ---- */
    .field { display: grid; gap: 6px; }
    .field > span { font-size: 14px; font-weight: 600; }
    .field small { font-weight: 400; color: var(--muted); }
    .field input, .field textarea {
      width: 100%; padding: var(--s3); min-height: 48px;
      border: 1px solid var(--line); border-radius: var(--r-md);
      background: var(--bg); font-size: 16px;
    }
    .field textarea { resize: vertical; line-height: 1.4; }
    .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .seg { border: 0; margin: 0; padding: 0; }
    .seg-track { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: var(--r-md); padding: 3px; }
    .seg legend { font-size: 14px; font-weight: 600; margin-bottom: 6px; padding: 0; }
    .seg label { position: relative; }
    .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
    .seg span { display: block; padding: var(--s2); text-align: center; border-radius: var(--r-sm); font-size: 15px; font-weight: 600; color: var(--muted); }
    .seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
    .seg input:focus-visible + span { outline: 2px solid var(--accent); }

    /* ---- sheet ---- */
    dialog.sheet {
      margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh;
      padding: 0; border: 0; border-radius: var(--r-lg) var(--r-lg) 0 0;
      background: var(--surface); color: var(--ink);
    }
    dialog.sheet[open] { animation: rise 0.22s ease-out; }
    dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.4); }
    @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
    .sheet-head {
      position: sticky; top: 0; z-index: 1;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: var(--s2) var(--s4); background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .sheet-head .link:first-child { justify-self: start; }
    .sheet-head .link:last-child { justify-self: end; }
    .sheet-body { display: grid; gap: var(--s4); padding: var(--s4) var(--s4) calc(env(safe-area-inset-bottom) + var(--s6)); }

    /* ---- tab bar ---- */
    .tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; justify-content: center;
      padding: 6px max(var(--s4), env(safe-area-inset-right)) max(env(safe-area-inset-bottom), var(--s2)) max(var(--s4), env(safe-area-inset-left));
      background: var(--tabbar);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid var(--line);
    }
    .tabs a {
      flex: 1; max-width: 140px;
      display: grid; justify-items: center; gap: 2px; padding: var(--s1) 0;
      color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600;
    }
    .tabs a svg { font-size: 26px; stroke-width: 2; }
    .tabs a[aria-current] { color: var(--accent); }

    /* ---- toast ---- */
    #toast {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 3;
      transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
      max-width: calc(100% - 32px); padding: var(--s3) var(--s4);
      background: var(--ink); color: var(--bg); border-radius: var(--r-md);
      font-size: 15px; font-weight: 600; transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="main" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Today
    </a>
    <a href="#plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      Plan
    </a>
    <a href="#plans">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      Plans
    </a>
  </nav>

  <dialog id="sheet" class="sheet" aria-label="Edit"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>Run Tracker needs JavaScript turned on.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
